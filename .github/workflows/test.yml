name: Task Town checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/pixel-task-town]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: town-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Isolated UI regression tests
        env:
          TOWN_SCREENSHOT_DIR: ${{ runner.temp }}/town-ui
        run: npm run test:ui
      - name: Real browser, service, queue and installed recorder
        run: npm run test:e2e
